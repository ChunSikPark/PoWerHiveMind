name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the graph dates each page by its first commit
      - name: Assemble the site
        run: |
          mkdir -p _site/demos
          cp site/index.html site/validation.html site/logo.svg site/v05-thermal-map.png site/install.html site/demo-design.html site/demo-has-page.html site/demo-new-page.html _site/
          cp -r assets _site/assets
          cp docs/agents/pages/*.html _site/demos/
          python3 site/build_data.py _site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
